<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Situs.id - Aplikasi Online Shop</title>
  <!-- Load Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS untuk efek futuristik -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #38bdf8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

    .page { display: none; width: 100%; max-width: 1100px; }
    .page.active { display: block; }

    /* --- KOMPONEN VAPOUR EFFECT --- */
    .vapour-title {
        font-weight: 800;
        background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: pulse 2s infinite;
        letter-spacing: 0.05em;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

    /* --- HALAMAN UTAMA --- */
    #homePage { text-align: center; }
    .logo-container { margin-bottom: 40px; }
    .button-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    
    .liquid-btn {
      position: relative; width: 260px; padding: 18px 30px; border: 2px solid var(--primary);
      border-radius: 50px; background: transparent; color: var(--primary);
      font-size: 20px; font-weight: 600; cursor: pointer; overflow: hidden;
      transition: color 0.4s ease; text-align: center;
    }
    .liquid-btn span { position: relative; z-index: 2; }
    .liquid-btn::before {
      content: ''; position: absolute; width: 120%; height: 220%;
      left: -10%; top: 100%; background: var(--primary);
      border-radius: 45%; transition: top 0.6s ease;
    }
    .liquid-btn:hover { color: var(--bg); }
    .liquid-btn:hover::before { top: -60%; }

    /* --- COMMON COMPONENTS --- */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .wa-cs-btn { background: #25d366; color: white; padding: 10px 18px; border-radius: 50px; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .section-title { font-size: 20px; margin-bottom: 15px; color: var(--primary); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; }
    .btn-submit { background: var(--primary); color: var(--bg); width: 100%; padding: 12px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    .btn-back { display: inline-block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn-back:hover { color: var(--primary); }

    /* --- HALAMAN PENGUNJUNG --- */
    .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
    @media(max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .product-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid #334155; text-align: center; }
    .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .product-name { font-size: 18px; font-weight: 600; margin: 10px 0 5px; }
    .product-price { color: var(--primary); font-size: 14px; margin-bottom: 5px; }
    .product-stock { color: var(--text-muted); font-size: 13px; margin-bottom: 10px; }
    .btn-action { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 8px 15px; border-radius: 25px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s; }
    .btn-action:hover { background: var(--primary); color: var(--bg); }
    .checkout-section { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .cart-items { margin-bottom: 15px; max-height: 140px; overflow-y: auto; font-size: 14px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .estimation { font-size: 13px; color: #38bdf8; margin: 10px 0; font-style: italic; }

    /* --- HALAMAN ADMIN --- */
    .admin-card { background: var(--card-bg); max-width: 450px; margin: 0 auto; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
    .admin-dashboard { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
    .success-msg { color: #22c55e; font-size: 13px; margin-top: 5px; display: none; font-weight: bold; }
    .admin-table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
    th { background: #0f172a; color: var(--primary); }
    .admin-input-edit { width: 100%; padding: 5px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; font-size: 12px; }

    /* Modal Product Knowledge */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: var(--card-bg); padding: 30px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; border: 1px solid var(--primary); }
    .close-modal { margin-top: 15px; background: #ef4444; color: white; border: none; padding: 6px 15px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. HALAMAN UTAMA -->
  <div id="homePage" class="page active">
    <div class="logo-container">
      <h1 class="vapour-title" style="font-size: 3.5rem;">SITUS.ID</h1>
      <p style="color: var(--text-muted); margin-top: 10px;">Platform Online Shop Profesional</p>
    </div>
    <div class="button-container">
      <button class="liquid-btn" onclick="switchPage('pengunjungPage')"><span>Pengunjung</span></button>
      <button class="liquid-btn" onclick="switchPage('adminLoginPage')"><span>Admin Only</span></button>
    </div>
  </div>

  <!-- 2. HALAMAN PENGUNJUNG -->
  <div id="pengunjungPage" class="page">
    <header>
      <div class="vapour-title" style="font-size: 24px;">SITUS.ID</div>
      <a href="https://wa.me/6289694221399?text=Halo%20CS%20Situs.id" target="_blank" class="wa-cs-btn">💬 Hubungi CS</a>
    </header>
    <div class="main-grid">
      <div>
        <h2 class="section-title">Katalog Produk</h2>
        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
          <button class="btn-action" style="width: auto; padding: 6px 15px;" onclick="filterCategory('All')">Semua</button>
          <button class="btn-action" style="width: auto; padding: 6px 15px;" onclick="filterCategory('Sparepart')">Sparepart</button>
          <button class="btn-action" style="width: auto; padding: 6px 15px;" onclick="filterCategory('Food')">Food</button>
        </div>
        <div class="product-grid" id="dynamicProductGrid"></div>
      </div>
      <div class="checkout-section">
        <h2 class="section-title">🛒 Keranjang Belanja</h2>
        <div class="cart-items" id="cartItems"><p style="color: var(--text-muted);">Keranjang kosong.</p></div>
        <div class="form-group"><label>Nama</label><input type="text" id="buyerName" placeholder="Nama Anda"></div>
        <div class="form-group"><label>No. HP</label><input type="text" id="buyerPhone" placeholder="08123456789"></div>
        <div class="form-group"><label>Alamat</label><input type="text" id="buyerAddress" placeholder="Alamat lengkap"></div>
        <button class="btn-submit" onclick="checkoutWhatsApp()">Proses Pesanan</button>
      </div>
    </div>
    <a class="btn-back" onclick="switchPage('homePage')">← Kembali ke Beranda</a>
  </div>

  <!-- 3. HALAMAN LOGIN ADMIN -->
  <div id="adminLoginPage" class="page">
    <div class="admin-card">
      <h2 class="section-title" style="text-align: center;">Login Admin</h2>
      <div class="form-group"><label>Email</label><input type="text" id="adminEmail"></div>
      <div class="form-group"><label>Password</label><input type="password" id="adminPassword"></div>
      <button class="btn-submit" onclick="loginAdmin()">Masuk Dashboard</button>
      <a class="btn-back" onclick="switchPage('homePage')">← Kembali ke Beranda</a>
    </div>
  </div>

  <!-- 4. HALAMAN DASHBOARD ADMIN -->
  <div id="adminDashboardPage" class="page">
    <header>
      <div class="vapour-title" style="font-size: 24px;">Dashboard Admin - SITUS.ID</div>
      <a class="btn-back" onclick="switchPage('homePage')" style="margin: 0; color: #ef4444;">Logout</a>
    </header>
    <!-- Konten Dashboard Anda -->
    <div class="admin-dashboard">
        <h2 class="section-title">📦 Tambah Produk</h2>
        <!-- (Form input Anda tetap ada di sini) -->
        <input type="text" id="pName" placeholder="Nama Produk" class="admin-input-edit" style="margin-bottom:10px;">
        <button class="btn-submit" onclick="uploadProduct()">Simpan Produk</button>
    </div>
    <div class="admin-dashboard">
      <h2 class="section-title">🛠️ Kelola Katalog</h2>
      <div class="admin-table-container"><table><thead><tr><th>Nama</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="adminProductTableBody"></tbody></table></div>
    </div>
  </div>

  <div class="modal" id="productModal"><div class="modal-content"><h3 id="modalTitle"></h3><p id="modalDesc"></p><button class="close-modal" onclick="closeModal()">Tutup</button></div></div>

  <script>
    // ... (Masukkan kembali seluruh fungsi JavaScript Anda dari file lama ke sini)
    // Supabase config
    const SUPABASE_URL = 'https://upkhbgcbeqztslqzknrz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_UsrUlMQmmb7lmhqNlFQ6zQ_SPtFItqs';
    const dbSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Salin kembali semua fungsi fetchProducts, loginAdmin, dll dari file lama Anda ke sini...
    // Contoh dasar agar tidak error:
    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }
    window.onload = function() { /* fetchProducts(); */ };
  </script>
</body>
</html>
